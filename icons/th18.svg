<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- glow ring -->
  <circle cx="32" cy="32" r="30" fill="#1a2a1a" stroke="#f1c40f" stroke-width="2" opacity="0.6"/>
  <!-- base -->
  <rect x="6" y="18" width="52" height="40" rx="3" fill="#c47a38" stroke="#f5a623" stroke-width="2"/>
  <rect x="12" y="24" width="40" height="28" rx="2" fill="#e09e5b"/>
  <!-- tower -->
  <rect x="24" y="2" width="16" height="22" rx="2" fill="#e8b87a" stroke="#f5a623" stroke-width="1.5"/>
  <!-- roof -->
  <polygon points="2,18 32,2 62,18" fill="#e74c3c" stroke="#f1c40f" stroke-width="2"/>
  <!-- gold trim base -->
  <rect x="6" y="18" width="52" height="4" rx="1" fill="#f1c40f"/>
  <!-- door -->
  <rect x="26" y="34" width="12" height="18" rx="6" fill="#2c1810" stroke="#f1c40f" stroke-width="1"/>
  <!-- stars -->
  <text x="20" y="38" font-size="8" fill="#ffd700" text-anchor="middle" font-weight="bold">★</text>
  <text x="32" y="43" font-size="7" fill="#ffd700" text-anchor="middle" font-weight="bold">★</text>
  <text x="44" y="38" font-size="8" fill="#ffd700" text-anchor="middle" font-weight="bold">★</text>
  <!-- TH text -->
  <text x="32" y="16" font-size="5" fill="#fff" text-anchor="middle" font-weight="bold" font-family="sans-serif">TH</text>
</svg>

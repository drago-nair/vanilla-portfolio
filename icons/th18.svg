<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- glow ring -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e" stroke="#f1c40f" stroke-width="2" opacity="0.5"/>
  <!-- base building -->
  <rect x="6" y="18" width="52" height="40" rx="3" fill="#e8e0d8" stroke="#c0b8a8" stroke-width="1.5"/>
  <rect x="12" y="24" width="40" height="28" rx="2" fill="#f5f0e8"/>
  <!-- tower -->
  <rect x="24" y="2" width="16" height="22" rx="2" fill="#faf6f0" stroke="#d4c8b8" stroke-width="1"/>
  <!-- roof -->
  <polygon points="2,18 32,2 62,18" fill="#d4a843" stroke="#f1c40f" stroke-width="2"/>
  <!-- gold trim -->
  <rect x="6" y="18" width="52" height="4" rx="1" fill="#c9a834"/>
  <rect x="6" y="54" width="52" height="4" rx="1" fill="#c9a834"/>
  <!-- gold pillars -->
  <rect x="10" y="22" width="3" height="32" fill="#d4a843"/>
  <rect x="51" y="22" width="3" height="32" fill="#d4a843"/>
  <!-- door -->
  <rect x="26" y="34" width="12" height="18" rx="6" fill="#2c2c3e" stroke="#c9a834" stroke-width="1.5"/>
  <!-- stars -->
  <text x="20" y="40" font-size="8" fill="#ffd700" text-anchor="middle" font-weight="bold">★</text>
  <text x="32" y="45" font-size="7" fill="#ffd700" text-anchor="middle" font-weight="bold">★</text>
  <text x="44" y="40" font-size="8" fill="#ffd700" text-anchor="middle" font-weight="bold">★</text>
  <!-- TH text -->
  <text x="32" y="15" font-size="5" fill="#2c2c3e" text-anchor="middle" font-weight="bold" font-family="sans-serif">TH</text>
</svg>

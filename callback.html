<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Spotify Auth</title></head>
<body>
<h2>✅ Authorized!</h2>
<p>Copy the code below and send it to Malenia:</p>
<pre id="code" style="font-size:18px;word-break:break-all;background:#111;color:#4ade80;padding:16px;border-radius:8px;"></pre>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
if (code) {
  document.getElementById('code').textContent = code;
} else {
  document.getElementById('code').textContent = 'No code found in URL. Check the address bar.';
}
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#080e0d"/>
  <!-- Docker whale silhouette (stylized) -->
  <rect x="100" y="100" width="180" height="130" rx="20" fill="#131c1a" stroke="#22c55e" stroke-width="2"/>
  <rect x="300" y="120" width="400" height="90" rx="12" fill="#131c1a" stroke="#e11d48" stroke-width="1.5"/>
  <rect x="300" y="230" width="250" height="60" rx="12" fill="#131c1a" stroke="#e11d48" stroke-width="1.5"/>
  <rect x="570" y="230" width="130" height="60" rx="12" fill="#131c1a" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Connection lines -->
  <line x1="280" y1="165" x2="300" y2="165" stroke="#e11d48" stroke-width="2"/>
  <line x1="280" y1="260" x2="300" y2="260" stroke="#22c55e" stroke-width="2"/>
  <!-- Agent label -->
  <text x="190" y="170" text-anchor="middle" fill="#e11d48" font-family="monospace" font-size="14" font-weight="bold">Hermes</text>
  <text x="190" y="195" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12">Agent</text>
  <!-- Bottom label -->
  <text x="400" y="470" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="16" font-weight="bold">Docker · DeepSeek V4 · s6-overlay</text>
</svg>
